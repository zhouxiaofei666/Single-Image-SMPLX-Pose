[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "occluded-sitting-smplx"
version = "0.1.0"
description = "Single-image SMPL-X reconstruction powered by pretrained SMPLer-X-S32"
readme = "README.md"
requires-python = ">=3.8,<3.11"
license = { file = "LICENSE" }
authors = [{ name = "Occluded-Sitting-SMPLX contributors" }]
keywords = ["SMPL-X", "human-mesh-recovery", "SMPLer-X", "computer-vision"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3.8",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==1.23.5",
  "Pillow==10.4.0",
  "opencv-python-headless==4.10.0.84",
  "trimesh==4.4.9",
  "pyrender==0.1.45",
]

[project.optional-dependencies]
web = ["gradio==4.44.1", "huggingface-hub==0.25.2", "pydantic==2.9.2"]
dev = ["pytest==8.3.5", "pytest-cov==5.0.0", "ruff==0.8.6"]

[project.scripts]
smplx-reconstruct = "occluded_sitting_smplx.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["gpu: requires CUDA and licensed model assets"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035"]
